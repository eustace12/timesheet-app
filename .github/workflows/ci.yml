name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Vercel deploy
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          HOOK_URL=$(printf '%s' "$VERCEL_DEPLOY_HOOK" | tr -d '[:space:]')
          if [ -z "$HOOK_URL" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK secret is missing. Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          case "$HOOK_URL" in
            https://api.vercel.com/*) ;;
            *)
              echo "::error::VERCEL_DEPLOY_HOOK must be a Vercel deploy hook URL (https://api.vercel.com/...)."
              exit 1
              ;;
          esac
          curl -fsS -X POST "$HOOK_URL"
