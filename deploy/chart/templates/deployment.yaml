{{- $repository := required "Set image.repository to the reviewed image registry/repository" .Values.image.repository -}}
{{- $tag := required "Set image.tag to the reviewed release tag" .Values.image.tag -}}
{{- $secret := required "Set existingSecret to a runtime-injected Secret in this namespace" .Values.existingSecret -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: {app.kubernetes.io/name: urchin-people, app.kubernetes.io/instance: {{ .Release.Name | quote }}}
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: urchin-people, app.kubernetes.io/instance: {{ .Release.Name | quote }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: urchin-people, app.kubernetes.io/instance: {{ .Release.Name | quote }}}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: people
          image: {{ printf "%s:%s" $repository $tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env:
            - {name: APP_MODE, value: production}
            - {name: DEMO_MODE, value: "0"}
            - {name: OUTPUT_DIR, value: /tmp/generated}
            - {name: SUPABASE_STORAGE_BUCKET, value: {{ .Values.storageBucket | quote }}}
            - {name: SSO_EMAIL_MAPPING_JSON, value: {{ .Values.identityMapping | toJson | quote }}}
            {{- range $key := list "SECRET_KEY" "SSO_PROXY_SECRET" "SUPABASE_URL" "SUPABASE_SERVICE_ROLE_KEY" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef: {name: {{ $secret | quote }}, key: {{ $key }}}
            {{- end }}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: scratch, mountPath: /tmp}
      volumes:
        - name: scratch
          emptyDir: {sizeLimit: 512Mi}
