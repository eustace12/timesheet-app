<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timesheet · Urchin Systems</title>

    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png') }}">
    <meta name="theme-color" content="#1E3A5F">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='mvp.css') }}">
</head>
<body class="login-page">
<div class="login-card">
    <header class="header">
        <div class="header-inner">
            <div class="header-brand">
                <img
                    class="header-mark"
                    src="{{ url_for('static', filename='favicon-32x32.png') }}"
                    width="52"
                    height="52"
                    alt="Urchin Systems"
                >
                <div>
                    <h1>Timesheet</h1>
                    <p>Urchin Systems</p>
                </div>
            </div>
            <img
                class="header-wordmark"
                src="{{ url_for('static', filename='logo.png') }}"
                alt="Urchin Systems"
            >
        </div>
    </header>

    <div class="login-body">
        {% if error %}
        <div class="alert error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login">
            <div class="field-row single">
                <div class="field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" autocomplete="username" required>
                </div>
            </div>
            <div class="field-row single">
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Log in</button>
        </form>

        <p class="login-hint">
            admin / admin123 (accountant)<br>
            employee / employee123<br>
            stanislav / employee123
        </p>
    </div>
</div>
</body>
</html>
