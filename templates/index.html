<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timesheet Generator</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

    <style>
        :root {
            --bg:            #EEF2F7;
            --surface:       #FFFFFF;
            --primary:       #2563EB;
            --primary-dark:  #1E40AF;
            --primary-light: #EFF6FF;
            --primary-ring:  rgba(37,99,235,.15);
            --text:          #0F172A;
            --text-muted:    #64748B;
            --text-light:    #94A3B8;
            --border:        #E2E8F0;
            --border-hover:  #CBD5E1;
            --shadow-sm:     0 1px 3px rgba(0,0,0,.07), 0 1px 2px rgba(0,0,0,.04);
            --shadow:        0 4px 6px rgba(0,0,0,.05), 0 10px 15px rgba(0,0,0,.06);
            --shadow-xl:     0 24px 48px rgba(0,0,0,.10), 0 8px 16px rgba(0,0,0,.06);
            --radius-sm:     8px;
            --radius:        12px;
            --radius-lg:     20px;
            --success:       #16A34A;
            --success-bg:    #F0FDF4;
            --warning:       #D97706;
            --warning-bg:    #FFFBEB;
            --danger:        #DC2626;
            --danger-bg:     #FEF2F2;
            --vacation:      #2563EB;
            --vacation-bg:   #EFF6FF;
            --sick:          #D97706;
            --sick-bg:       #FFFBEB;
            --custom:        #7C3AED;
            --custom-bg:     #F5F3FF;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            padding: 24px 16px 48px;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 860px;
            margin: 0 auto;
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xl);
            overflow: hidden;
            animation: fadeUp .4s ease-out;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── HEADER ── */
        .header {
            background: #0D1B2E;
            color: white;
            padding: 34px 40px 32px;
            position: relative;
            overflow: hidden;
        }

        /* Moldova flag strip */
        .header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, #003DA5 33.33%, #FFD700 33.33% 66.66%, #CC0001 66.66%);
        }

        /* Subtle dot grid */
        .header::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255,255,255,.04) 1px, transparent 1px);
            background-size: 26px 26px;
            pointer-events: none;
        }

        .header-inner {
            position: relative;
            z-index: 1;
        }

        .header-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,.08);
            border: 1px solid rgba(255,255,255,.12);
            padding: 3px 10px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .6px;
            text-transform: uppercase;
            color: rgba(255,255,255,.7);
            margin-bottom: 12px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -.4px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 13px;
            color: rgba(255,255,255,.5);
        }

        /* ── FORM ── */
        .form-wrap { padding: 36px 40px; }

        .field-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .field-row.single { grid-template-columns: 1fr; }

        .field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .field label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: .5px;
        }

        .field input,
        .field select {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: inherit;
            color: var(--text);
            background: white;
            outline: none;
            transition: border-color .18s, box-shadow .18s;
        }

        .field input:focus,
        .field select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-ring);
        }

        .field input::placeholder { color: var(--text-light); }

        .hr { height: 1px; background: var(--border); margin: 28px 0; }

        .section-head {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .7px;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        /* ── ABSENCE CARDS ── */
        .absence-stack { display: flex; flex-direction: column; gap: 10px; }

        .absence-card {
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: box-shadow .2s;
        }
        .absence-card:hover { box-shadow: var(--shadow-sm); }
        .absence-card.vacation { border-left-width: 3px; border-left-color: var(--vacation); }
        .absence-card.sick     { border-left-width: 3px; border-left-color: var(--sick); }
        .absence-card.custom   { border-left-width: 3px; border-left-color: var(--custom); }

        .absence-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: #F8FAFC;
            border-bottom: 1px solid var(--border);
        }

        .absence-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
        }

        .absence-icon { font-size: 17px; line-height: 1; }

        .btn-clear {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            transition: all .15s;
        }
        .btn-clear:hover {
            background: var(--danger-bg);
            border-color: #FECACA;
            color: var(--danger);
        }

        .absence-body { padding: 14px 16px; }

        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-bottom: 10px;
        }

        .qbtn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 13px;
            background: white;
            border: 1.5px solid var(--border);
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            font-family: inherit;
            transition: all .15s;
            white-space: nowrap;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .qbtn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-light);
        }

        .qbtn:active { transform: scale(.97); }

        .qbtn.pick {
            border-color: var(--primary);
            color: var(--primary);
        }
        .qbtn.pick:hover {
            background: var(--primary);
            color: white;
        }

        .selected-dates {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            min-height: 22px;
        }

        .date-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 11px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
            color: white;
            animation: popIn .2s ease-out;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(.88); }
            to   { opacity: 1; transform: scale(1); }
        }

        .date-badge.vacation { background: var(--vacation); }
        .date-badge.sick     { background: var(--sick); }
        .date-badge.custom   { background: var(--custom); }

        .badge-remove {
            cursor: pointer;
            opacity: .7;
            font-size: 13px;
            line-height: 1;
            transition: opacity .15s;
        }
        .badge-remove:hover { opacity: 1; }

        .reason-block {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        /* ── STATS ── */
        .stats-section { margin-top: 24px; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 10px;
        }

        .stat-card {
            background: #F8FAFC;
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 10px;
            text-align: center;
            transition: border-color .2s;
        }

        .stat-card.c-work     { background: var(--primary-light);  border-color: rgba(37,99,235,.25); }
        .stat-card.c-holiday  { background: var(--danger-bg);       border-color: rgba(220,38,38,.2); }
        .stat-card.c-hours    { background: var(--success-bg);      border-color: rgba(22,163,74,.2); }

        .stat-ico  { font-size: 18px; margin-bottom: 5px; }
        .stat-val  { font-size: 22px; font-weight: 700; line-height: 1; margin-bottom: 3px; color: var(--text); }
        .stat-lbl  { font-size: 11px; font-weight: 500; color: var(--text-muted); }

        .stat-card.c-work    .stat-val { color: var(--primary); }
        .stat-card.c-holiday .stat-val { color: var(--danger); }
        .stat-card.c-hours   .stat-val { color: var(--success); font-size: 18px; }

        .absence-chips {
            display: flex;
            gap: 8px;
        }

        .chip {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 13px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 600;
        }
        .chip.vacation { background: var(--vacation-bg); color: var(--vacation); }
        .chip.sick     { background: var(--sick-bg);     color: var(--sick); }
        .chip.custom   { background: var(--custom-bg);   color: var(--custom); }

        .chip strong { font-size: 14px; font-weight: 700; }

        /* ── VALIDATION HINT ── */
        .hint {
            display: none;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            margin-top: 12px;
        }
        .hint.info    { background: var(--primary-light); color: #1D4ED8; border-left: 3px solid var(--primary); }
        .hint.warning { background: var(--warning-bg);    color: var(--warning); border-left: 3px solid var(--warning); }
        .hint.success { background: var(--success-bg);    color: var(--success); border-left: 3px solid var(--success); }

        /* ── GENERATE BUTTON ── */
        .btn-generate {
            width: 100%;
            margin-top: 26px;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            outline: none;
            transition: background .2s, transform .15s, box-shadow .2s;
            box-shadow: 0 4px 14px rgba(37,99,235,.3);
            -webkit-tap-highlight-color: transparent;
        }
        .btn-generate:hover     { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 6px 18px rgba(37,99,235,.35); }
        .btn-generate:active    { transform: none; box-shadow: none; }
        .btn-generate:disabled  { opacity: .5; cursor: not-allowed; transform: none; pointer-events: none; }

        /* ── LOADING / RESULT ── */
        .loading {
            display: none;
            text-align: center;
            padding: 18px 0;
        }

        .spinner {
            width: 30px; height: 30px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin .7s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .loading p { font-size: 13px; color: var(--text-muted); font-weight: 500; }

        .result {
            display: none;
            margin-top: 14px;
            padding: 14px 16px;
            border-radius: var(--radius-sm);
            font-size: 14px;
        }
        .result.success { background: var(--success-bg); border: 1.5px solid rgba(22,163,74,.25); color: #14532D; }
        .result.error   { background: var(--danger-bg);  border: 1.5px solid rgba(220,38,38,.25);  color: #7F1D1D; }
        .result h3 { margin-bottom: 5px; font-size: 15px; }

        /* ── CALENDAR BACKDROP ── */
        .cal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(10,15,28,.55);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            z-index: 9998;
            animation: bdIn .2s ease;
        }
        .cal-backdrop.active { display: block; }
        @keyframes bdIn { from { opacity: 0; } to { opacity: 1; } }

        /* ── FLATPICKR OVERRIDES ── */
        .flatpickr-calendar {
            box-shadow: 0 24px 60px rgba(0,0,0,.25) !important;
            border-radius: 16px !important;
            z-index: 9999 !important;
            border: none !important;
            font-family: 'Inter', -apple-system, sans-serif !important;
            overflow: hidden !important;
            width: 310px !important;
            position: fixed !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) !important;
        }

        .flatpickr-calendar.arrowTop::before,
        .flatpickr-calendar.arrowTop::after { display: none !important; }

        .flatpickr-months {
            background: #0D1B2E !important;
            border-radius: 16px 16px 0 0 !important;
            padding: 15px 14px !important;
            position: relative;
        }

        .flatpickr-month { color: white !important; fill: white !important; }

        .flatpickr-current-month {
            color: white !important;
            font-weight: 600 !important;
            font-size: 14px !important;
            cursor: default !important;
            pointer-events: none !important;
        }

        .flatpickr-prev-month,
        .flatpickr-next-month { display: none !important; }

        .flatpickr-weekdays {
            background: #F8FAFC !important;
            padding: 6px 0 !important;
            border-bottom: 1px solid var(--border) !important;
        }

        .flatpickr-weekday {
            color: var(--text-muted) !important;
            font-weight: 600 !important;
            font-size: 10px !important;
            text-transform: uppercase !important;
            letter-spacing: .3px !important;
        }

        .flatpickr-days { padding: 8px !important; background: white !important; }

        .flatpickr-day {
            border-radius: 8px !important;
            border: none !important;
            color: var(--text) !important;
            font-weight: 500 !important;
            transition: all .15s !important;
            margin: 1px !important;
            height: 36px !important;
            line-height: 32px !important;
            font-size: 13px !important;
            position: relative !important;
        }

        .flatpickr-day:hover { background: #F1F5F9 !important; }

        .flatpickr-day.selected {
            background: var(--primary) !important;
            border-color: var(--primary) !important;
            color: white !important;
            font-weight: 700 !important;
            box-shadow: 0 2px 8px rgba(37,99,235,.35) !important;
        }

        .flatpickr-day.selected.startRange,
        .flatpickr-day.selected.endRange {
            background: #1E40AF !important;
            box-shadow: 0 2px 10px rgba(30,64,175,.4) !important;
        }

        .flatpickr-day.inRange {
            background: #DBEAFE !important;
            border-color: #DBEAFE !important;
            color: #1D4ED8 !important;
        }

        .flatpickr-day.flatpickr-disabled,
        .flatpickr-day.prevMonthDay,
        .flatpickr-day.nextMonthDay {
            color: var(--text-light) !important;
            opacity: .35 !important;
        }

        .flatpickr-day.today {
            border: 2px solid var(--primary) !important;
            background: white !important;
            color: var(--primary) !important;
            font-weight: 700 !important;
        }
        .flatpickr-day.today:hover { background: var(--primary-light) !important; }

        /* Holiday days */
        .flatpickr-day.is-holiday {
            color: #B91C1C !important;
            font-weight: 700 !important;
        }
        .flatpickr-day.is-holiday::after {
            content: '';
            position: absolute !important;
            bottom: 3px !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            width: 4px !important;
            height: 4px !important;
            background: #EF4444 !important;
            border-radius: 50% !important;
        }
        /* Hide dot when selected */
        .flatpickr-day.is-holiday.selected::after,
        .flatpickr-day.is-holiday.inRange::after { display: none !important; }

        /* Calendar close button */
        .cal-close {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,.1);
            border: 1px solid rgba(255,255,255,.18);
            color: white;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s;
            z-index: 5;
        }
        .cal-close:hover { background: rgba(255,255,255,.2); }

        /* Holiday legend strip */
        .cal-holiday-strip {
            display: none;
            padding: 7px 14px;
            background: #FEF2F2;
            font-size: 11px;
            color: #991B1B;
            font-weight: 500;
            border-top: 1px solid #FECACA;
        }
        .cal-holiday-strip.visible { display: block; }

        /* Done button (multiple mode) */
        .cal-footer {
            padding: 9px 14px;
            background: white;
            border-top: 1px solid var(--border);
            text-align: right;
        }
        .cal-done {
            padding: 7px 18px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background .15s;
        }
        .cal-done:hover { background: var(--primary-dark); }

        /* ── RESPONSIVE ── */
        @media (max-width: 768px) {
            body { padding: 10px 8px 40px; }

            .header    { padding: 22px 20px; }
            .header h1 { font-size: 21px; }
            .form-wrap { padding: 22px 20px; }

            .field-row       { grid-template-columns: 1fr; gap: 12px; }
            .stats-grid      { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .absence-chips   { flex-direction: column; }

            .flatpickr-calendar {
                width: 88vw !important;
                max-width: 310px !important;
            }
        }

        @media (max-width: 420px) {
            .header h1   { font-size: 18px; }
            .stat-val    { font-size: 20px; }
            .quick-actions { gap: 5px; }
            .qbtn { padding: 6px 11px; font-size: 11px; }
        }
    </style>
</head>
<body>
<div class="container">

    <header class="header">
        <div class="header-inner">
            <div class="header-tag">🇲🇩 Republic of Moldova</div>
            <h1>Timesheet Generator</h1>
            <p>Monthly work hours with official public holidays</p>
        </div>
    </header>

    <div class="form-wrap">
        <form id="timesheetForm">

            <!-- Period -->
            <div class="section-head">Period</div>
            <div class="field-row">
                <div class="field">
                    <label for="year">Year</label>
                    <input type="number" id="year" name="year" value="{{ current_year }}" min="2020" max="2030" required>
                </div>
                <div class="field">
                    <label for="month">Month</label>
                    <select id="month" name="month" required>
                        {% for i in range(1, 13) %}
                        <option value="{{ i }}" {% if i == current_month %}selected{% endif %}>
                            {{ months[i-1] }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <!-- Employee -->
            <div class="section-head" style="margin-top:20px;">Employee</div>
            <div class="field-row single">
                <div class="field">
                    <label for="employee_name">Full Name</label>
                    <input type="text" id="employee_name" name="employee_name" value="Iuntevici Stanislav" placeholder="Employee name" required>
                </div>
            </div>

            <input type="hidden" id="company_name"  name="company_name"  value="Urchin Systems SA">
            <input type="hidden" id="hours_per_day" name="hours_per_day" value="8">

            <div class="hr"></div>

            <!-- Absences -->
            <div class="section-head">
                Absences
                <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--text-light);font-size:11px;margin-left:4px;">— optional</span>
            </div>

            <div class="absence-stack">

                <!-- Vacation -->
                <div class="absence-card vacation">
                    <div class="absence-head">
                        <div class="absence-label">
                            <span class="absence-icon">🏖️</span> Vacation
                        </div>
                        <button type="button" class="btn-clear" onclick="clearVacation()">Clear</button>
                    </div>
                    <div class="absence-body">
                        <input type="text" id="vacation" name="vacation" style="display:none;">
                        <div class="quick-actions">
                            <button type="button" class="qbtn" onclick="setQuickVacation(5)">1 Week</button>
                            <button type="button" class="qbtn" onclick="setQuickVacation(10)">2 Weeks</button>
                            <button type="button" class="qbtn" onclick="setQuickVacation(15)">3 Weeks</button>
                            <button type="button" class="qbtn pick" onclick="openCalendar('vacation')">📅 Pick Dates</button>
                        </div>
                        <div class="selected-dates" id="vacationDisplay"></div>
                    </div>
                </div>

                <!-- Sick Leave -->
                <div class="absence-card sick">
                    <div class="absence-head">
                        <div class="absence-label">
                            <span class="absence-icon">🤒</span> Sick Leave
                        </div>
                        <button type="button" class="btn-clear" onclick="clearSick()">Clear</button>
                    </div>
                    <div class="absence-body">
                        <input type="text" id="sick" name="sick" style="display:none;">
                        <div class="quick-actions">
                            <button type="button" class="qbtn pick" onclick="openCalendar('sick')">📅 Pick Dates</button>
                        </div>
                        <div class="selected-dates" id="sickDisplay"></div>
                    </div>
                </div>

                <!-- Other Days -->
                <div class="absence-card custom">
                    <div class="absence-head">
                        <div class="absence-label">
                            <span class="absence-icon">📝</span> Other Days
                        </div>
                        <button type="button" class="btn-clear" onclick="clearCustom()">Clear</button>
                    </div>
                    <div class="absence-body">
                        <input type="text" id="custom_days" name="custom_days" style="display:none;">
                        <div class="quick-actions">
                            <button type="button" class="qbtn pick" onclick="openCalendar('custom')">📅 Pick Dates</button>
                        </div>
                        <div class="selected-dates" id="customDisplay"></div>
                        <div class="reason-block">
                            <div class="field">
                                <label for="custom_reason">Reason</label>
                                <input type="text" id="custom_reason" name="custom_reason" placeholder="e.g. Personal Day">
                            </div>
                        </div>
                    </div>
                </div>

            </div><!-- /absence-stack -->

            <div class="hint" id="validationHint"></div>

            <!-- Stats -->
            <div class="stats-section" id="statsBox" style="display:none;">
                <div class="hr" style="margin-bottom:18px;"></div>
                <div class="section-head">Monthly Summary</div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-ico">📅</div>
                        <div class="stat-val" id="statTotalDays">—</div>
                        <div class="stat-lbl">Days in month</div>
                    </div>
                    <div class="stat-card c-work">
                        <div class="stat-ico">💼</div>
                        <div class="stat-val" id="statWorkingDays">—</div>
                        <div class="stat-lbl">Working days</div>
                    </div>
                    <div class="stat-card c-holiday">
                        <div class="stat-ico">🎉</div>
                        <div class="stat-val" id="statHolidays">—</div>
                        <div class="stat-lbl">Holidays</div>
                    </div>
                    <div class="stat-card c-hours">
                        <div class="stat-ico">⏰</div>
                        <div class="stat-val" id="statExpectedHours">—</div>
                        <div class="stat-lbl">Total hours</div>
                    </div>
                </div>

                <div class="absence-chips" id="absenceChips" style="display:none;">
                    <div class="chip vacation">
                        <span>🏖️ Vacation</span>
                        <strong id="statVacation">—</strong>
                    </div>
                    <div class="chip sick">
                        <span>🤒 Sick</span>
                        <strong id="statSick">—</strong>
                    </div>
                    <div class="chip custom">
                        <span>📝 Other</span>
                        <strong id="statCustom">—</strong>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-generate" id="generateBtn">🚀 Generate Timesheet PDF</button>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Generating PDF…</p>
            </div>

            <div class="result" id="result"></div>

        </form>
    </div><!-- /form-wrap -->

</div><!-- /container -->

<!-- Calendar backdrop -->
<div id="calBackdrop" class="cal-backdrop" onclick="closeCalendar()"></div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
/* ── State ── */
let pickers          = null;
let holidaysCache    = {};
let activeCalType    = null;

/* ── Helpers ── */
function getYM() {
    return {
        year:  parseInt(document.getElementById('year').value),
        month: parseInt(document.getElementById('month').value),
    };
}

async function loadHolidays(year) {
    if (holidaysCache[year] !== undefined) return holidaysCache[year];
    try {
        const r = await fetch(`/holidays/${year}`);
        const d = await r.json();
        holidaysCache[year] = d;
        return d;
    } catch (e) {
        console.error('Holidays fetch failed:', e);
        holidaysCache[year] = [];
        return [];
    }
}

function getHolidayName(day, month, year) {
    const list = holidaysCache[year] || [];
    const h = list.find(h => h.month === month && h.day === day);
    return h ? h.name : null;
}

/* ── Calendar backdrop ── */
function openCalendar(type) {
    activeCalType = type;
    document.getElementById('calBackdrop').classList.add('active');
    if (!pickers) return;
    if (type === 'vacation') pickers.vacationPicker.open();
    else if (type === 'sick') pickers.sickPicker.open();
    else if (type === 'custom') pickers.customPicker.open();
}

function closeCalendar() {
    document.getElementById('calBackdrop').classList.remove('active');
    if (!pickers || !activeCalType) { activeCalType = null; return; }
    if (activeCalType === 'vacation') pickers.vacationPicker.close();
    else if (activeCalType === 'sick') pickers.sickPicker.close();
    else if (activeCalType === 'custom') pickers.customPicker.close();
    activeCalType = null;
}

function onCalClose() {
    document.getElementById('calBackdrop').classList.remove('active');
    activeCalType = null;
}

/* ── onDayCreate: highlight holidays ── */
function onDayCreate(dObj, dStr, fp, dayElem) {
    const date = dayElem.dateObj;
    if (!date) return;
    if (dayElem.classList.contains('prevMonthDay') || dayElem.classList.contains('nextMonthDay')) return;
    const name = getHolidayName(date.getDate(), date.getMonth() + 1, date.getFullYear());
    if (name) {
        dayElem.classList.add('is-holiday');
        dayElem.setAttribute('title', '🎉 ' + name);
    }
}

/* ── onReady: add close btn + holiday legend + done btn ── */
function makeOnReady(isMultiple) {
    return function(selectedDates, dateStr, instance) {
        instance.prevMonthNav.style.display = 'none';
        instance.nextMonthNav.style.display = 'none';

        const monthNav = instance.calendarContainer.querySelector('.flatpickr-current-month');
        if (monthNav) { monthNav.style.pointerEvents = 'none'; monthNav.style.cursor = 'default'; }

        // Close button
        const closeBtn = document.createElement('button');
        closeBtn.type = 'button';
        closeBtn.className = 'cal-close';
        closeBtn.innerHTML = '✕';
        closeBtn.addEventListener('click', e => { e.stopPropagation(); closeCalendar(); });
        instance.calendarContainer.querySelector('.flatpickr-months').appendChild(closeBtn);

        // Holiday legend
        const { year, month } = getYM();
        const list = holidaysCache[year] || [];
        const monthHols = list.filter(h => h.month === month);
        if (monthHols.length) {
            const strip = document.createElement('div');
            strip.className = 'cal-holiday-strip visible';
            const names = [...new Set(monthHols.map(h => h.name))];
            strip.textContent = '🎉 ' + names.join(' · ');
            instance.calendarContainer.appendChild(strip);
        }

        // Done button (multiple mode only)
        if (isMultiple) {
            const footer = document.createElement('div');
            footer.className = 'cal-footer';
            footer.innerHTML = '<button type="button" class="cal-done">Done</button>';
            footer.querySelector('.cal-done').addEventListener('click', closeCalendar);
            instance.calendarContainer.appendChild(footer);
        }
    };
}

/* ── Calendar init ── */
function initCalendars() {
    const { year, month } = getYM();
    const minDate = new Date(year, month - 1, 1);
    const maxDate = new Date(year, month,     0);

    const base = {
        minDate,
        maxDate,
        dateFormat: 'd M',
        clickOpens: false,
        allowInput: false,
        onDayCreate,
        onClose: onCalClose,
    };

    const vacationPicker = flatpickr('#vacation', {
        ...base,
        mode: 'range',
        onChange(dates) {
            const fmt = fmtDates(dates);
            setDateInput('vacation', fmt);
            updateDisplay('vacation', dates);
            updateStats();
        },
        onReady: makeOnReady(false),
    });

    const sickPicker = flatpickr('#sick', {
        ...base,
        mode: 'range',
        onChange(dates) {
            const fmt = fmtDates(dates);
            setDateInput('sick', fmt);
            updateDisplay('sick', dates);
            updateStats();
        },
        onReady: makeOnReady(false),
    });

    const customPicker = flatpickr('#custom_days', {
        ...base,
        mode: 'multiple',
        conjunction: ', ',
        onChange(dates) {
            const fmt = fmtDates(dates);
            setDateInput('custom_days', fmt);
            updateDisplay('custom', dates);
            updateStats();
        },
        onReady: makeOnReady(true),
    });

    return { vacationPicker, sickPicker, customPicker };
}

function setDateInput(id, value) {
    const el = document.getElementById(id);
    el.value = value;
    if (value) el.setAttribute('data-value', value);
    else el.removeAttribute('data-value');
}

/* ── Format dates for backend ── */
function fmtDates(dates) {
    if (!dates || !dates.length) return '';
    const { year, month } = getYM();
    const days = dates
        .filter(d => d.getMonth() + 1 === month && d.getFullYear() === year)
        .map(d => d.getDate())
        .sort((a, b) => a - b);
    if (!days.length) return '';
    if (days.length === 1) return String(days[0]);
    // Check consecutive
    let consecutive = true;
    for (let i = 1; i < days.length; i++) {
        if (days[i] !== days[i-1] + 1) { consecutive = false; break; }
    }
    return consecutive ? `${days[0]}-${days[days.length - 1]}` : days.join(',');
}

/* ── Date badge display ── */
function updateDisplay(type, dates) {
    const { year, month } = getYM();
    const mName = new Date(year, month - 1, 1).toLocaleString('en-US', { month: 'short' });
    const ids    = { vacation: 'vacationDisplay', sick: 'sickDisplay', custom: 'customDisplay' };
    const icons  = { vacation: '🏖️', sick: '🤒', custom: '📝' };
    const cls    = type;

    const div = document.getElementById(ids[type]);
    if (!dates || !dates.length) {
        div.innerHTML = '';
        return;
    }

    const days = dates.map(d => d.getDate()).sort((a, b) => a - b);
    let text;
    if (days.length === 1) {
        text = `${mName} ${days[0]}`;
    } else {
        const isRange = days[days.length - 1] - days[0] === days.length - 1;
        if (isRange) {
            text = `${mName} ${days[0]}–${days[days.length - 1]} (${days.length} days)`;
        } else {
            text = `${days.length} days: ${days.join(', ')}`;
        }
    }

    div.innerHTML = `
        <div class="date-badge ${cls}">
            <span>${icons[type]}</span>
            <span>${text}</span>
            <span class="badge-remove" onclick="${type === 'vacation' ? 'clearVacation' : type === 'sick' ? 'clearSick' : 'clearCustom'}()">✕</span>
        </div>`;
}

/* ── Clear functions ── */
function clearVacation() {
    pickers?.vacationPicker?.clear();
    setDateInput('vacation', '');
    document.getElementById('vacationDisplay').innerHTML = '';
    updateStats();
}
function clearSick() {
    pickers?.sickPicker?.clear();
    setDateInput('sick', '');
    document.getElementById('sickDisplay').innerHTML = '';
    updateStats();
}
function clearCustom() {
    pickers?.customPicker?.clear();
    setDateInput('custom_days', '');
    document.getElementById('customDisplay').innerHTML = '';
    updateStats();
}

/* ── Quick vacation (skips weekends + holidays) ── */
function setQuickVacation(workDays) {
    const { year, month } = getYM();
    const daysInMonth = new Date(year, month, 0).getDate();
    const hols = new Set(
        (holidaysCache[year] || []).filter(h => h.month === month).map(h => h.day)
    );

    let start = null, end = null, count = 0;

    for (let d = 1; d <= daysInMonth && count < workDays; d++) {
        const dow = new Date(year, month - 1, d).getDay();
        if (dow === 0 || dow === 6 || hols.has(d)) continue;
        if (start === null) start = d;
        end = d;
        count++;
    }

    if (start === null || !pickers?.vacationPicker) return;

    const s = new Date(year, month - 1, start);
    const e = new Date(year, month - 1, end);
    pickers.vacationPicker.setDate([s, e]);
    setDateInput('vacation', `${start}-${end}`);
    updateDisplay('vacation', [s, e]);
    setTimeout(updateStats, 80);
}

/* ── Parse day string to Set ── */
function parseDaySet(str) {
    const set = new Set();
    if (!str) return set;
    for (const part of str.split(',')) {
        const t = part.trim();
        if (t.includes('-')) {
            const [a, b] = t.split('-').map(Number);
            for (let i = a; i <= b; i++) set.add(i);
        } else {
            const n = parseInt(t);
            if (!isNaN(n)) set.add(n);
        }
    }
    return set;
}

/* ── Stats calculation ── */
async function calculateStats() {
    const { year, month } = getYM();
    const total = new Date(year, month, 0).getDate();

    await loadHolidays(year);
    const holDays = new Set(
        (holidaysCache[year] || []).filter(h => h.month === month).map(h => h.day)
    );

    const vacSet    = parseDaySet(document.getElementById('vacation').getAttribute('data-value') || '');
    const sickSet   = parseDaySet(document.getElementById('sick').getAttribute('data-value') || '');
    const customSet = parseDaySet(document.getElementById('custom_days').getAttribute('data-value') || '');

    let working = 0, vacDays = 0, sickDays = 0, customDays = 0;

    for (let d = 1; d <= total; d++) {
        const dow = new Date(year, month - 1, d).getDay();
        const weekend  = dow === 0 || dow === 6;
        const holiday  = holDays.has(d);
        const vac      = vacSet.has(d);
        const sick     = sickSet.has(d);
        const custom   = customSet.has(d);

        if (vac)    vacDays++;
        if (sick)   sickDays++;
        if (custom) customDays++;

        if (!weekend && !holiday && !vac && !sick && !custom) working++;
    }

    return {
        total,
        working,
        holidays: holDays.size,
        vacDays,
        sickDays,
        customDays,
        hours: working * 8,
    };
}

async function updateStats() {
    const s = await calculateStats();

    document.getElementById('statTotalDays').textContent    = s.total;
    document.getElementById('statWorkingDays').textContent  = s.working;
    document.getElementById('statHolidays').textContent     = s.holidays;
    document.getElementById('statExpectedHours').textContent = s.hours + 'h';

    document.getElementById('statVacation').textContent = s.vacDays  ? s.vacDays  + ' d' : '—';
    document.getElementById('statSick').textContent     = s.sickDays ? s.sickDays + ' d' : '—';
    document.getElementById('statCustom').textContent   = s.customDays ? s.customDays + ' d' : '—';

    document.getElementById('statsBox').style.display = 'block';

    const hasAbsences = s.vacDays + s.sickDays + s.customDays > 0;
    document.getElementById('absenceChips').style.display = hasAbsences ? 'flex' : 'none';

    const hint  = document.getElementById('validationHint');
    const total = s.vacDays + s.sickDays + s.customDays;
    if (total > 0) {
        if (s.working < 5) {
            hint.className = 'hint warning';
            hint.innerHTML = `⚠️ Only ${s.working} working days this month (${s.hours}h)`;
        } else {
            hint.className = 'hint success';
            hint.innerHTML = `✅ ${total} absence day(s) — ${s.working} working days (${s.hours}h)`;
        }
    } else {
        hint.className = 'hint info';
        hint.innerHTML = `ℹ️ Full month: ${s.working} working days = ${s.hours} hours`;
    }
    hint.style.display = 'block';
}

/* ── Reinitialize on month/year change ── */
async function reinit() {
    if (pickers) {
        pickers.vacationPicker.destroy();
        pickers.sickPicker.destroy();
        pickers.customPicker.destroy();
    }
    // Clear selections since old dates are invalid in new month
    ['vacation', 'sick', 'custom_days'].forEach(id => setDateInput(id, ''));
    ['vacationDisplay', 'sickDisplay', 'customDisplay'].forEach(id => {
        document.getElementById(id).innerHTML = '';
    });

    const { year } = getYM();
    await loadHolidays(year);
    pickers = initCalendars();
    updateStats();
}

/* ── Bootstrap ── */
async function init() {
    const { year } = getYM();
    await loadHolidays(year);
    pickers = initCalendars();
    updateStats();
}

init();

document.getElementById('year').addEventListener('change',  reinit);
document.getElementById('month').addEventListener('change', reinit);

/* ── Form submit ── */
document.getElementById('timesheetForm').addEventListener('submit', async e => {
    e.preventDefault();
    const form     = e.target;
    const formData = new FormData(form);

    ['vacation', 'sick', 'custom_days'].forEach(id => {
        const val = document.getElementById(id).getAttribute('data-value');
        if (val) formData.set(id, val);
    });

    const btn     = document.getElementById('generateBtn');
    const loading = document.getElementById('loading');
    const result  = document.getElementById('result');

    btn.disabled           = true;
    loading.style.display  = 'block';
    result.style.display   = 'none';

    try {
        const resp = await fetch('/generate', { method: 'POST', body: formData });
        const ct   = resp.headers.get('content-type') || '';

        if (ct.includes('application/pdf')) {
            const blob = await resp.blob();
            const url  = URL.createObjectURL(blob);
            const a    = Object.assign(document.createElement('a'), { href: url });

            const cd   = resp.headers.get('content-disposition') || '';
            const m    = cd.match(/filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/);
            a.download = m ? m[1].replace(/['"]/g, '') : 'timesheet.pdf';

            document.body.appendChild(a);
            a.click();
            URL.revokeObjectURL(url);
            document.body.removeChild(a);

            result.className = 'result success';
            result.innerHTML = '<h3>✅ Success!</h3><p>PDF downloaded — check your Downloads folder.</p>';
        } else {
            const data = await resp.json();
            throw new Error(data.error || 'Unknown error');
        }
    } catch (err) {
        result.className = 'result error';
        result.innerHTML = `<h3>❌ Error</h3><p>${err.message}</p>`;
    } finally {
        btn.disabled          = false;
        loading.style.display = 'none';
        result.style.display  = 'block';
    }
});
</script>
</body>
