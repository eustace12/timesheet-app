<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timesheet Generator · Urchin Systems</title>

    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <meta name="theme-color" content="#1E3A5F">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

    <style>
        :root {
            --bg:            #F4F6F9;
            --surface:       #FFFFFF;
            --primary:       #1E3A5F;
            --primary-dark:  #152A45;
            --primary-light: #F0F4F8;
            --primary-ring:  rgba(30,58,95,.12);
            --accent:        #3B82F6;
            --text:          #0F172A;
            --text-muted:    #64748B;
            --text-light:    #94A3B8;
            --border:        #E8ECF1;
            --border-hover:  #CBD5E1;
            --shadow-sm:     0 1px 2px rgba(15,23,42,.04);
            --shadow:        0 2px 8px rgba(15,23,42,.06);
            --shadow-xl:     0 8px 32px rgba(15,23,42,.08);
            --radius-sm:     8px;
            --radius:        10px;
            --radius-lg:     16px;
            --success:       #16A34A;
            --success-bg:    #F0FDF4;
            --warning:       #D97706;
            --warning-bg:    #FFFBEB;
            --danger:        #DC2626;
            --danger-bg:     #FEF2F2;
            --vacation:      #2563EB;
            --vacation-bg:   #EFF6FF;
            --sick:          #D97706;
            --sick-bg:       #FFFBEB;
            --custom:        #7C3AED;
            --custom-bg:     #F5F3FF;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            padding: 32px 16px 56px;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 860px;
            margin: 0 auto;
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xl);
            overflow: hidden;
            animation: fadeUp .4s ease-out;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── HEADER ── */
        .header {
            background: var(--primary);
            color: white;
            padding: 36px 40px 34px;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: var(--accent);
        }

        .header-inner { position: relative; z-index: 1; }

        .header-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.1);
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .5px;
            text-transform: uppercase;
            color: rgba(255,255,255,.65);
            margin-bottom: 14px;
        }

        .header h1 { font-size: 24px; font-weight: 700; letter-spacing: -.3px; margin-bottom: 6px; }
        .header p  { font-size: 13px; color: rgba(255,255,255,.55); font-weight: 400; }

        /* ── FORM ── */
        .form-wrap { padding: 36px 40px; }

        .field-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }
        .field-row.single { grid-template-columns: 1fr; }

        .field { display: flex; flex-direction: column; gap: 5px; }

        .field label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: .5px;
        }

        .field input,
        .field select {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: inherit;
            color: var(--text);
            background: white;
            outline: none;
            transition: border-color .18s, box-shadow .18s;
        }

        .field input:focus,
        .field select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--primary-ring);
        }

        .field input::placeholder { color: var(--text-light); }

        .hr { height: 1px; background: var(--border); margin: 28px 0; }

        .section-head {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .7px;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        /* ── ABSENCE CARDS ── */
        .absence-stack { display: flex; flex-direction: column; gap: 10px; }

        .absence-card {
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: box-shadow .2s;
        }
        .absence-card:hover { box-shadow: var(--shadow-sm); }
        .absence-card.vacation { border-left-width: 3px; border-left-color: var(--vacation); }
        .absence-card.sick     { border-left-width: 3px; border-left-color: var(--sick); }
        .absence-card.custom   { border-left-width: 3px; border-left-color: var(--custom); }

        .absence-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: #F8FAFC;
            border-bottom: 1px solid var(--border);
        }

        .absence-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 600;
        }

        .type-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .type-dot.vacation { background: var(--vacation); }
        .type-dot.sick     { background: var(--sick); }
        .type-dot.custom   { background: var(--custom); }

        .btn-clear {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            transition: all .15s;
        }
        .btn-clear:hover { background: var(--danger-bg); border-color: #FECACA; color: var(--danger); }

        .absence-body { padding: 14px 16px; }

        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-bottom: 10px;
        }

        .qbtn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 13px;
            background: white;
            border: 1.5px solid var(--border);
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            font-family: inherit;
            transition: all .15s;
            white-space: nowrap;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .qbtn:hover { border-color: var(--accent); color: var(--accent); background: var(--primary-light); }
        .qbtn:active { transform: scale(.98); }

        .qbtn.pick { border-color: var(--accent); color: var(--accent); }
        .qbtn.pick:hover { background: var(--accent); color: white; }

        .qbtn svg, .btn-preview svg, .btn-generate svg {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
        }

        .selected-dates {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            min-height: 22px;
        }

        .date-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 11px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
            color: white;
            animation: popIn .2s ease-out;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(.88); }
            to   { opacity: 1; transform: scale(1); }
        }

        .date-badge.vacation { background: var(--vacation); }
        .date-badge.sick     { background: var(--sick); }
        .date-badge.custom   { background: var(--custom); }

        .badge-remove {
            cursor: pointer;
            opacity: .65;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(255,255,255,.2);
            transition: opacity .15s, background .15s;
        }
        .badge-remove:hover { opacity: 1; background: rgba(255,255,255,.35); }
        .badge-remove svg { width: 10px; height: 10px; }

        .badge-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,.7);
            flex-shrink: 0;
        }

        .reason-block {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        /* ── STATS ── */
        .stats-section { margin-top: 24px; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 10px;
        }

        .stat-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 12px;
            text-align: center;
            transition: border-color .2s;
            position: relative;
        }

        .stat-card.c-work     { border-top: 2px solid var(--accent); }
        .stat-card.c-holiday  { border-top: 2px solid var(--danger); }
        .stat-card.c-hours    { border-top: 2px solid var(--success); }
        .stat-card.c-total    { border-top: 2px solid var(--text-light); }

        .stat-accent {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin: 0 auto 8px;
        }
        .stat-accent.neutral { background: var(--text-light); }
        .stat-accent.work    { background: var(--accent); }
        .stat-accent.holiday { background: var(--danger); }
        .stat-accent.hours   { background: var(--success); }

        .stat-val  { font-size: 24px; font-weight: 700; line-height: 1; margin-bottom: 4px; color: var(--text); letter-spacing: -.5px; }
        .stat-lbl  { font-size: 11px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: .3px; }

        .stat-card.c-work    .stat-val { color: var(--accent); }
        .stat-card.c-holiday .stat-val { color: var(--danger); }
        .stat-card.c-hours   .stat-val { color: var(--success); font-size: 20px; }

        .absence-chips { display: flex; gap: 8px; }

        .chip {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 600;
            border-left: 3px solid transparent;
        }
        .chip.vacation { background: var(--vacation-bg); color: var(--vacation); border-left-color: var(--vacation); }
        .chip.sick     { background: var(--sick-bg);     color: var(--sick);     border-left-color: var(--sick); }
        .chip.custom   { background: var(--custom-bg);   color: var(--custom);   border-left-color: var(--custom); }
        .chip-label    { display: flex; align-items: center; gap: 8px; }
        .chip strong   { font-size: 14px; font-weight: 700; }

        /* ── VALIDATION HINT ── */
        .hint {
            display: none;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            margin-top: 12px;
        }
        .hint.info    { background: var(--primary-light); color: #1E3A5F; border-left: 3px solid var(--accent); }
        .hint.warning { background: var(--warning-bg);    color: var(--warning); border-left: 3px solid var(--warning); }
        .hint.success { background: var(--success-bg);    color: var(--success); border-left: 3px solid var(--success); }

        .hint-label {
            font-weight: 600;
            margin-right: 4px;
        }

        /* ── BUTTON ROW ── */
        .btn-row {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 10px;
            margin-top: 26px;
        }

        .btn-preview {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px 16px;
            background: white;
            color: var(--primary);
            border: 1.5px solid var(--border-hover);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            outline: none;
            transition: background .2s, border-color .2s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-preview:hover    { background: var(--primary-light); border-color: var(--accent); color: var(--accent); }
        .btn-preview:active   { transform: none; }
        .btn-preview:disabled { opacity: .5; cursor: not-allowed; }

        .btn-generate {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            outline: none;
            transition: background .2s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-generate:hover     { background: var(--primary-dark); }
        .btn-generate:active    { transform: none; }
        .btn-generate:disabled  { opacity: .5; cursor: not-allowed; pointer-events: none; }

        /* ── FORMAT SELECTOR ── */
        .format-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            margin-bottom: -6px;
        }

        .format-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: .5px;
        }

        .format-options {
            display: flex;
            gap: 8px;
        }

        .format-opt {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: border-color .15s, background .15s, color .15s;
            user-select: none;
        }

        .format-opt input { display: none; }

        .format-opt svg {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
        }

        .format-opt:has(input:checked) {
            border-color: var(--accent);
            background: var(--primary-light);
            color: var(--primary);
        }

        .format-opt:hover { border-color: var(--border-hover); }

        /* ── LOADING / RESULT ── */
        .loading { display: none; text-align: center; padding: 18px 0; }

        .spinner {
            width: 30px; height: 30px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin .7s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .loading p { font-size: 13px; color: var(--text-muted); font-weight: 500; }

        .result {
            display: none;
            margin-top: 14px;
            padding: 14px 16px;
            border-radius: var(--radius-sm);
            font-size: 14px;
        }
        .result.success { background: var(--success-bg); border: 1.5px solid rgba(22,163,74,.25); color: #14532D; }
        .result.error   { background: var(--danger-bg);  border: 1.5px solid rgba(220,38,38,.25); color: #7F1D1D; }
        .result h3 { margin-bottom: 5px; font-size: 15px; }

        /* ── PREVIEW SECTION ── */
        .preview-section { margin-top: 24px; }

        .preview-section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .preview-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .preview-table-wrap {
            overflow-x: auto;
            border-radius: var(--radius);
            border: 1.5px solid var(--border);
        }

        .preview-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .preview-table th {
            background: var(--primary);
            color: white;
            padding: 10px 14px;
            text-align: left;
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .5px;
        }

        .preview-table th:last-child { text-align: right; }

        .preview-table td {
            padding: 9px 14px;
            border-bottom: 1px solid var(--border);
        }

        .preview-table tbody tr:last-child td { border-bottom: none; }

        .preview-table tr.row-working  td { background: white; }
        .preview-table tr.row-weekend  td { background: #F8FAFC; color: var(--text-muted); }
        .preview-table tr.row-holiday  td { background: var(--danger-bg);  color: #991B1B; font-weight: 500; }
        .preview-table tr.row-vacation td { background: var(--vacation-bg); color: #1D4ED8; font-weight: 500; }
        .preview-table tr.row-sick     td { background: var(--sick-bg);    color: #92400E; font-weight: 500; }
        .preview-table tr.row-custom   td { background: var(--custom-bg);  color: #5B21B6; font-weight: 500; }
        .preview-table tr.row-summary  td {
            background: var(--success-bg);
            font-weight: 700;
            color: var(--success);
            border-top: 2px solid #86EFAC;
        }

        .preview-table td:last-child { text-align: right; font-weight: 600; }
        .preview-table tr.row-summary td:last-child { font-size: 14px; }

        .btn-close-preview {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            transition: all .15s;
        }
        .btn-close-preview:hover { background: var(--danger-bg); border-color: #FECACA; color: var(--danger); }

        .preview-hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 10px;
            padding: 8px 12px;
            background: var(--primary-light);
            border-radius: var(--radius-sm);
            border-left: 3px solid var(--primary);
        }
        .preview-hint.success {
            background: var(--success-bg);
            border-color: var(--success);
            color: var(--success);
        }

        .preview-table tr.preview-editable { cursor: pointer; }
        .preview-table tr.preview-editable:hover td { filter: brightness(0.97); }
        .preview-table tr.preview-editable:active td { filter: brightness(0.94); }
        .preview-table tr.preview-locked { cursor: default; }

        .preview-edit-ico, .preview-lock-ico {
            display: inline-flex;
            align-items: center;
            vertical-align: middle;
            opacity: .35;
            margin-left: 6px;
        }
        .preview-edit-ico svg, .preview-lock-ico svg { width: 12px; height: 12px; }
        .preview-table tr.preview-editable:hover .preview-edit-ico { opacity: .75; }
        .preview-table tr.preview-locked .preview-lock-ico { opacity: .4; }

        .preview-actions {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .btn-apply-preview {
            flex: 1;
            min-width: 140px;
            padding: 12px 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background .2s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-apply-preview:hover { background: var(--primary-dark); }

        .btn-refresh-preview {
            padding: 12px 16px;
            background: white;
            color: var(--text-muted);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-refresh-preview:hover { border-color: var(--primary); color: var(--primary); }

        /* ── CALENDAR BACKDROP ── */
        .cal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(10,15,28,.55);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            z-index: 9998;
            animation: bdIn .2s ease;
        }
        .cal-backdrop.active { display: block; }
        @keyframes bdIn { from { opacity: 0; } to { opacity: 1; } }

        /* ── FLATPICKR OVERRIDES ── */
        .flatpickr-calendar {
            box-shadow: var(--shadow-xl) !important;
            border-radius: 12px !important;
            z-index: 9999 !important;
            border: 1px solid var(--border) !important;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif !important;
            overflow: hidden !important;
            width: 310px !important;
            position: fixed !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) !important;
        }

        .flatpickr-calendar.arrowTop::before,
        .flatpickr-calendar.arrowTop::after { display: none !important; }

        .flatpickr-months {
            background: var(--primary) !important;
            border-radius: 12px 12px 0 0 !important;
            padding: 15px 14px !important;
            position: relative;
        }

        .flatpickr-month { color: white !important; fill: white !important; }

        .flatpickr-current-month {
            color: #F8FAFC !important;
            font-weight: 600 !important;
            font-size: 14px !important;
            cursor: default !important;
            pointer-events: none !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 6px !important;
        }

        .flatpickr-current-month .cur-month,
        .flatpickr-current-month .cur-year-static,
        .flatpickr-current-month .flatpickr-monthDropdown-months {
            color: #F8FAFC !important;
            background: transparent !important;
            font-weight: 600 !important;
            -webkit-text-fill-color: #F8FAFC !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
            margin: 0 !important;
            cursor: default !important;
            pointer-events: none !important;
        }

        /* Fallback if monthSelectorType static is unavailable: hide select chevron */
        .flatpickr-current-month .flatpickr-monthDropdown-months {
            -webkit-appearance: none !important;
            appearance: none !important;
            background-image: none !important;
        }

        .flatpickr-current-month input.cur-year {
            color: #F8FAFC !important;
            background: transparent !important;
            -webkit-text-fill-color: #F8FAFC !important;
            caret-color: transparent !important;
            font-weight: 600 !important;
            border: none !important;
            box-shadow: none !important;
            pointer-events: none !important;
        }

        .flatpickr-current-month .numInputWrapper {
            background: transparent !important;
            pointer-events: none !important;
        }

        .flatpickr-current-month .numInputWrapper span.arrowUp,
        .flatpickr-current-month .numInputWrapper span.arrowDown {
            display: none !important;
        }

        .flatpickr-prev-month,
        .flatpickr-next-month { display: none !important; }

        .flatpickr-weekdays {
            background: #F8FAFC !important;
            padding: 6px 0 !important;
            border-bottom: 1px solid var(--border) !important;
        }

        .flatpickr-weekday {
            color: var(--text-muted) !important;
            font-weight: 600 !important;
            font-size: 10px !important;
            text-transform: uppercase !important;
            letter-spacing: .3px !important;
        }

        .flatpickr-days { padding: 8px !important; background: white !important; }

        .flatpickr-day {
            border-radius: 8px !important;
            border: none !important;
            color: var(--text) !important;
            font-weight: 500 !important;
            transition: all .15s !important;
            margin: 1px !important;
            height: 36px !important;
            line-height: 32px !important;
            font-size: 13px !important;
            position: relative !important;
        }

        .flatpickr-day:hover { background: #F1F5F9 !important; }

        .flatpickr-day.selected {
            background: var(--accent) !important;
            border-color: var(--accent) !important;
            color: white !important;
            font-weight: 700 !important;
        }

        .flatpickr-day.selected.startRange,
        .flatpickr-day.selected.endRange {
            background: var(--primary-dark) !important;
        }

        .flatpickr-day.inRange {
            background: #DBEAFE !important;
            border-color: #DBEAFE !important;
            color: #1D4ED8 !important;
        }

        .flatpickr-day.flatpickr-disabled,
        .flatpickr-day.prevMonthDay,
        .flatpickr-day.nextMonthDay {
            color: var(--text-light) !important;
            opacity: .35 !important;
        }

        .flatpickr-day.today {
            border: 2px solid var(--accent) !important;
            background: white !important;
            color: var(--accent) !important;
            font-weight: 700 !important;
        }
        .flatpickr-day.today:hover { background: var(--primary-light) !important; }

        .flatpickr-day.is-holiday {
            color: #B91C1C !important;
            font-weight: 700 !important;
        }
        .flatpickr-day.is-holiday::after {
            content: '';
            position: absolute !important;
            bottom: 3px !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            width: 4px !important;
            height: 4px !important;
            background: #EF4444 !important;
            border-radius: 50% !important;
        }
        .flatpickr-day.is-holiday.selected::after,
        .flatpickr-day.is-holiday.inRange::after { display: none !important; }

        .cal-close {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,.1);
            border: 1px solid rgba(255,255,255,.18);
            color: white;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s;
            z-index: 5;
        }
        .cal-close:hover { background: rgba(255,255,255,.2); }

        .cal-close svg { width: 12px; height: 12px; }

        .cal-holiday-strip {
            display: none;
            padding: 7px 14px;
            background: #FEF2F2;
            font-size: 11px;
            color: #991B1B;
            font-weight: 500;
            border-top: 1px solid #FECACA;
        }
        .cal-holiday-strip.visible { display: block; }

        .cal-footer {
            padding: 9px 14px;
            background: white;
            border-top: 1px solid var(--border);
            text-align: right;
        }
        .cal-done {
            padding: 7px 18px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background .15s;
        }
        .cal-done:hover { background: var(--primary-dark); }

        /* ── RESPONSIVE ── */
        @media (max-width: 768px) {
            body { padding: 10px 8px 40px; }

            .header    { padding: 22px 20px; }
            .header h1 { font-size: 21px; }
            .form-wrap { padding: 22px 20px; }

            .field-row       { grid-template-columns: 1fr; gap: 12px; }
            .stats-grid      { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .absence-chips   { flex-direction: column; }
            .btn-row         { grid-template-columns: 1fr; }

            .flatpickr-calendar {
                width: 88vw !important;
                max-width: 310px !important;
            }
        }

        @media (max-width: 420px) {
            .header h1   { font-size: 18px; }
            .stat-val    { font-size: 20px; }
            .quick-actions { gap: 5px; }
            .qbtn { padding: 6px 11px; font-size: 11px; }
        }
    </style>
</head>
<body>
<div class="container">

    <header class="header">
        <div class="header-inner">
            <div class="header-tag">Republic of Moldova</div>
            <h1>Timesheet Generator</h1>
            <p>Monthly work hours · holidays from Nager.Date (MD)</p>
        </div>
    </header>

    <div class="form-wrap">
        <form id="timesheetForm">

            <!-- Period -->
            <div class="section-head">Period</div>
            <div class="field-row">
                <div class="field">
                    <label for="year">Year</label>
                    <input type="number" id="year" name="year" value="{{ current_year }}" min="2020" max="2030" required>
                </div>
                <div class="field">
                    <label for="month">Month</label>
                    <select id="month" name="month" required>
                        {% for i in range(1, 13) %}
                        <option value="{{ i }}" {% if i == current_month %}selected{% endif %}>
                            {{ months[i-1] }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <!-- Employee -->
            <div class="section-head" style="margin-top:20px;">Employee</div>
            <div class="field-row single">
                <div class="field">
                    <label for="employee_name">Full Name</label>
                    <input type="text" id="employee_name" name="employee_name" value="Iuntevici Stanislav" placeholder="Employee name" required>
                </div>
            </div>

            <input type="hidden" id="company_name"  name="company_name"  value="Urchin Systems SA">
            <input type="hidden" id="hours_per_day" name="hours_per_day" value="8">

            <div class="hr"></div>

            <!-- Absences -->
            <div class="section-head">
                Absences
                <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--text-light);font-size:11px;margin-left:4px;">— optional</span>
            </div>

            <div class="absence-stack">

                <!-- Vacation -->
                <div class="absence-card vacation">
                    <div class="absence-head">
                        <div class="absence-label">
                            <span class="type-dot vacation"></span> Vacation
                        </div>
                        <button type="button" class="btn-clear" onclick="clearVacation()" aria-label="Clear vacation periods">Clear</button>
                    </div>
                    <div class="absence-body">
                        <input type="hidden" id="vacation" name="vacation">
                        <div class="quick-actions">
                            <button type="button" class="qbtn" onclick="addQuickVacation(5)">+ 1 Week</button>
                            <button type="button" class="qbtn" onclick="addQuickVacation(10)">+ 2 Weeks</button>
                            <button type="button" class="qbtn" onclick="addQuickVacation(15)">+ 3 Weeks</button>
                            <button type="button" class="qbtn pick" onclick="openCalendar('vacation')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> Add Period</button>
                        </div>
                        <div class="selected-dates" id="vacationDisplay"></div>
                    </div>
                </div>

                <!-- Sick Leave -->
                <div class="absence-card sick">
                    <div class="absence-head">
                        <div class="absence-label">
                            <span class="type-dot sick"></span> Sick Leave
                        </div>
                        <button type="button" class="btn-clear" onclick="clearSick()">Clear</button>
                    </div>
                    <div class="absence-body">
                        <input type="hidden" id="sick" name="sick">
                        <div class="quick-actions">
                            <button type="button" class="qbtn pick" onclick="openCalendar('sick')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> Add Period</button>
                        </div>
                        <div class="selected-dates" id="sickDisplay"></div>
                    </div>
                </div>

                <!-- Other Days -->
                <div class="absence-card custom">
                    <div class="absence-head">
                        <div class="absence-label">
                            <span class="type-dot custom"></span> Other Days
                        </div>
                        <button type="button" class="btn-clear" onclick="clearCustom()">Clear</button>
                    </div>
                    <div class="absence-body">
                        <input type="text" id="custom_days" name="custom_days" style="display:none;">
                        <div class="quick-actions">
                            <button type="button" class="qbtn pick" onclick="openCalendar('custom')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> Pick Dates</button>
                        </div>
                        <div class="selected-dates" id="customDisplay"></div>
                        <div class="reason-block">
                            <div class="field">
                                <label for="custom_reason">Reason</label>
                                <input type="text" id="custom_reason" name="custom_reason" placeholder="e.g. Personal Day">
                            </div>
                        </div>
                    </div>
                </div>

            </div><!-- /absence-stack -->

            <div class="hint" id="validationHint"></div>

            <!-- Stats -->
            <div class="stats-section" id="statsBox" style="display:none;">
                <div class="hr" style="margin-bottom:18px;"></div>
                <div class="section-head">Monthly Summary</div>

                <div class="stats-grid">
                    <div class="stat-card c-total">
                        <div class="stat-accent neutral"></div>
                        <div class="stat-val" id="statTotalDays">—</div>
                        <div class="stat-lbl">Days in month</div>
                    </div>
                    <div class="stat-card c-work">
                        <div class="stat-accent work"></div>
                        <div class="stat-val" id="statWorkingDays">—</div>
                        <div class="stat-lbl">Working days</div>
                    </div>
                    <div class="stat-card c-holiday">
                        <div class="stat-accent holiday"></div>
                        <div class="stat-val" id="statHolidays">—</div>
                        <div class="stat-lbl">Holidays</div>
                    </div>
                    <div class="stat-card c-hours">
                        <div class="stat-accent hours"></div>
                        <div class="stat-val" id="statExpectedHours">—</div>
                        <div class="stat-lbl">Total hours</div>
                    </div>
                </div>

                <div class="absence-chips" id="absenceChips" style="display:none;">
                    <div class="chip vacation">
                        <span class="chip-label"><span class="type-dot vacation"></span> Vacation</span>
                        <strong id="statVacation">—</strong>
                    </div>
                    <div class="chip sick">
                        <span class="chip-label"><span class="type-dot sick"></span> Sick</span>
                        <strong id="statSick">—</strong>
                    </div>
                    <div class="chip custom">
                        <span class="chip-label"><span class="type-dot custom"></span> Other</span>
                        <strong id="statCustom">—</strong>
                    </div>
                </div>
            </div>

            <!-- Action buttons -->
            <div class="format-row">
                <span class="format-label">Format</span>
                <div class="format-options">
                    <label class="format-opt">
                        <input type="radio" name="format" value="pdf" checked onchange="updateGenerateLabel()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                        PDF
                    </label>
                    <label class="format-opt">
                        <input type="radio" name="format" value="xlsx" onchange="updateGenerateLabel()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
                        Excel
                    </label>
                </div>
            </div>

            <div class="btn-row">
                <button type="button" class="btn-preview" id="previewBtn" onclick="showPreview()" aria-label="Preview timesheet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> Preview</button>
                <button type="submit" class="btn-generate" id="generateBtn" aria-label="Download timesheet file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> <span id="generateBtnLabel">Generate PDF</span></button>
            </div>

            <!-- Preview section -->
            <div class="preview-section" id="previewSection" style="display:none;">
                <div class="hr" style="margin-bottom:18px;"></div>
                <div class="preview-section-head">
                    <div class="section-head" style="margin-bottom:0;">
                        Timesheet Preview
                        <span id="previewMonthLabel" style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--text-light);font-size:11px;margin-left:4px;"></span>
                    </div>
                    <button type="button" class="btn-close-preview" onclick="closePreview()">Close</button>
                </div>
                <div id="previewContent"></div>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p id="loadingText">Generating…</p>
            </div>

            <div class="result" id="result"></div>

        </form>
    </div><!-- /form-wrap -->

</div><!-- /container -->

<!-- Calendar backdrop -->
<div id="calBackdrop" class="cal-backdrop" onclick="closeCalendar()"></div>

<!-- Hidden inputs for range period pickers (not submitted) -->
<input type="text" id="vacationPickerInput" style="display:none;" readonly>
<input type="text" id="sickPickerInput" style="display:none;" readonly>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
/* ── State ── */
let pickers          = null;
let holidaysCache    = {};
const STORAGE_KEY    = 'timesheetFormV1';
let activeCalType    = null;  // 'vacation' | 'sick' | 'custom'
let suppressCalClose = false; // skip onCalClose during programmatic clear()
let vacationPeriods  = [];    // [{start: Number, end: Number}]
let sickPeriods      = [];
let previewDays      = null;  // editable copy of /preview days[]

const PREVIEW_STATUS_MAP = {
    working:  { label: 'Working',    cls: 'row-working'  },
    weekend:  { label: 'Weekend',    cls: 'row-weekend'  },
    holiday:  { label: null,         cls: 'row-holiday'  },
    vacation: { label: 'Vacation',   cls: 'row-vacation' },
    sick:     { label: 'Sick Leave', cls: 'row-sick'     },
    custom:   { label: null,         cls: 'row-custom'   },
};
const PREVIEW_EDIT_CYCLE = ['working', 'vacation', 'sick', 'custom'];

const SVG = {
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
    eye:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>',
    download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
};
const PREVIEW_BTN_HTML = `${SVG.eye} Preview`;

function getSelectedFormat() {
    const checked = document.querySelector('input[name="format"]:checked');
    return checked ? checked.value : 'pdf';
}

function updateGenerateLabel() {
    const fmt = getSelectedFormat();
    document.getElementById('generateBtnLabel').textContent =
        fmt === 'xlsx' ? 'Download Excel' : 'Generate PDF';
}

function isDownloadResponse(ct) {
    return ct.includes('application/pdf')
        || ct.includes('application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}

/* ── Helpers ── */
function getYM() {
    return {
        year:  parseInt(document.getElementById('year').value),
        month: parseInt(document.getElementById('month').value),
    };
}

function holidayCacheKey(year) {
    return String(year);
}

function getHolidayList(year) {
    return holidaysCache[holidayCacheKey(year)] || [];
}

async function loadHolidays(year, force = false) {
    const key = holidayCacheKey(year);
    if (!force && holidaysCache[key] !== undefined) return holidaysCache[key];
    try {
        const r = await fetch(`/holidays/${year}`);
        const d = await r.json();
        const list = Array.isArray(d) ? d : (d.holidays || []);
        holidaysCache[key] = list;
        return list;
    } catch (e) {
        console.error('Holidays fetch failed:', e);
        holidaysCache[key] = [];
        return [];
    }
}

function periodsFromString(str) {
    if (!str) return [];
    return str.split(',').map(part => {
        const t = part.trim();
        if (!t) return null;
        if (t.includes('-')) {
            const [a, b] = t.split('-').map(Number);
            return { start: a, end: b };
        }
        const n = parseInt(t, 10);
        return { start: n, end: n };
    }).filter(Boolean);
}

function loadFormState() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const s = JSON.parse(raw);
        if (s.year) document.getElementById('year').value = s.year;
        if (s.month) document.getElementById('month').value = s.month;
        if (s.employee_name) document.getElementById('employee_name').value = s.employee_name;
        if (s.custom_reason) document.getElementById('custom_reason').value = s.custom_reason;
        if (s.format) {
            const radio = document.querySelector(`input[name="format"][value="${s.format}"]`);
            if (radio) radio.checked = true;
            updateGenerateLabel();
        }
        vacationPeriods = periodsFromString(s.vacation || '');
        sickPeriods = periodsFromString(s.sick || '');
        syncPeriodInput('vacation');
        syncPeriodInput('sick');
        renderPeriodBadges('vacation');
        renderPeriodBadges('sick');
        if (s.custom_days) setDateInput('custom_days', s.custom_days);
    } catch (e) {
        console.warn('Could not restore form state', e);
    }
}

function saveFormState() {
    try {
        const state = {
            year: document.getElementById('year').value,
            month: document.getElementById('month').value,
            employee_name: document.getElementById('employee_name').value,
            custom_reason: document.getElementById('custom_reason').value,
            format: getSelectedFormat(),
            vacation: document.getElementById('vacation').getAttribute('data-value') || '',
            sick: document.getElementById('sick').getAttribute('data-value') || '',
            custom_days: document.getElementById('custom_days').getAttribute('data-value') || '',
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
        console.warn('Could not save form state', e);
    }
}

function getHolidayName(day, month, year) {
    const list = getHolidayList(year);
    const h = list.find(h => h.month === month && h.day === day);
    return h ? h.name : null;
}

/* ── Calendar backdrop ── */
function openPeriodPicker(fp) {
    if (fp.selectedDates.length) {
        suppressCalClose = true;
        fp.clear(false);
        queueMicrotask(() => { suppressCalClose = false; });
    }
    fp.open();
}

function openCalendar(type) {
    document.getElementById('calBackdrop').classList.add('active');
    if (!pickers) {
        activeCalType = type;
        return;
    }
    activeCalType = type;
    if (type === 'vacation') {
        openPeriodPicker(pickers.vacationPicker);
    } else if (type === 'sick') {
        openPeriodPicker(pickers.sickPicker);
    } else if (type === 'custom') {
        pickers.customPicker.open();
    }
}

function closeCalendar() {
    document.getElementById('calBackdrop').classList.remove('active');
    if (pickers) {
        if (pickers.vacationPicker.isOpen) pickers.vacationPicker.close();
        if (pickers.sickPicker.isOpen)     pickers.sickPicker.close();
        if (pickers.customPicker.isOpen)   pickers.customPicker.close();
    }
    activeCalType = null;
}

function onCalClose() {
    if (suppressCalClose) return;
    document.getElementById('calBackdrop').classList.remove('active');
    activeCalType = null;
}

/* ── onDayCreate: highlight holidays ── */
function onDayCreate(dObj, dStr, fp, dayElem) {
    const d = dayElem.dateObj;
    if (!d) return;
    if (dayElem.classList.contains('prevMonthDay') || dayElem.classList.contains('nextMonthDay')) return;
    const name = getHolidayName(d.getDate(), d.getMonth() + 1, d.getFullYear());
    if (name) {
        dayElem.classList.add('is-holiday');
        dayElem.setAttribute('title', name);
    }
}

/* ── Replace editable month/year controls with static labels ── */
function staticizeMonthYearHeader(instance) {
    const { year, month } = getYM();
    const monthNav = instance.calendarContainer.querySelector('.flatpickr-current-month');
    if (!monthNav) return;

    const monthDropdown = monthNav.querySelector('.flatpickr-monthDropdown-months');
    if (monthDropdown) {
        const monthName = new Date(year, month - 1, 1).toLocaleString('en-US', { month: 'long' });
        const span = document.createElement('span');
        span.className = 'cur-month';
        span.textContent = monthName;
        monthDropdown.replaceWith(span);
    }

    const yearWrapper = monthNav.querySelector('.numInputWrapper');
    if (yearWrapper && !monthNav.querySelector('.cur-year-static')) {
        const span = document.createElement('span');
        span.className = 'cur-year-static';
        span.textContent = String(year);
        yearWrapper.replaceWith(span);
    }
}

/* ── onReady: close btn + holiday legend + optional done btn ── */
function makeOnReady(isMultiple) {
    return function(selectedDates, dateStr, instance) {
        instance.prevMonthNav.style.display = 'none';
        instance.nextMonthNav.style.display = 'none';

        staticizeMonthYearHeader(instance);

        const monthNav = instance.calendarContainer.querySelector('.flatpickr-current-month');
        if (monthNav) { monthNav.style.pointerEvents = 'none'; monthNav.style.cursor = 'default'; }

        const closeBtn = document.createElement('button');
        closeBtn.type = 'button';
        closeBtn.className = 'cal-close';
        closeBtn.innerHTML = SVG.close;
        closeBtn.addEventListener('click', e => { e.stopPropagation(); closeCalendar(); });
        instance.calendarContainer.querySelector('.flatpickr-months').appendChild(closeBtn);

        const { year, month } = getYM();
        const list = getHolidayList(year) || [];
        const monthHols = list.filter(h => h.month === month);
        if (monthHols.length) {
            const strip = document.createElement('div');
            strip.className = 'cal-holiday-strip visible';
            const names = [...new Set(monthHols.map(h => h.name))];
            strip.textContent = names.join(' · ');
            instance.calendarContainer.appendChild(strip);
        }

        if (isMultiple) {
            const footer = document.createElement('div');
            footer.className = 'cal-footer';
            footer.innerHTML = '<button type="button" class="cal-done">Done</button>';
            footer.querySelector('.cal-done').addEventListener('click', closeCalendar);
            instance.calendarContainer.appendChild(footer);
        }
    };
}

/* ── Period picker onChange (type bound at init — no activeCalType race) ── */
function makePeriodOnChange(type) {
    return function(dates, dateStr, instance) {
        if (dates.length !== 2) return;
        const start = dates[0].getDate();
        const end   = dates[1].getDate();
        if (type === 'vacation') {
            vacationPeriods.push({ start, end });
            renderPeriodBadges('vacation');
            syncPeriodInput('vacation');
        } else {
            sickPeriods.push({ start, end });
            renderPeriodBadges('sick');
            syncPeriodInput('sick');
        }
        setTimeout(() => {
            suppressCalClose = true;
            instance.clear(false);
            closeCalendar();
            updateStats();
            queueMicrotask(() => { suppressCalClose = false; });
        }, 150);
    };
}

/* ── Calendar init ── */
function initCalendars() {
    const { year, month } = getYM();
    const minDate = new Date(year, month - 1, 1);
    const maxDate = new Date(year, month,     0);

    const base = {
        minDate,
        maxDate,
        dateFormat: 'd M',
        clickOpens: false,
        allowInput: false,
        monthSelectorType: 'static',
        onDayCreate,
        onClose: onCalClose,
    };

    const rangeBase = {
        ...base,
        mode: 'range',
        onReady: makeOnReady(false),
    };

    const vacationPicker = flatpickr('#vacationPickerInput', {
        ...rangeBase,
        onChange: makePeriodOnChange('vacation'),
    });

    const sickPicker = flatpickr('#sickPickerInput', {
        ...rangeBase,
        onChange: makePeriodOnChange('sick'),
    });

    const customPicker = flatpickr('#custom_days', {
        ...base,
        mode: 'multiple',
        conjunction: ', ',
        onChange(dates) {
            setDateInput('custom_days', fmtDates(dates));
            updateDisplay('custom', dates);
            updateStats();
        },
        onReady: makeOnReady(true),
    });

    return { vacationPicker, sickPicker, customPicker };
}

/* ── Period badge rendering ── */
function renderPeriodBadges(type) {
    const { year, month } = getYM();
    const mName   = new Date(year, month - 1, 1).toLocaleString('en-US', { month: 'short' });
    const periods = type === 'vacation' ? vacationPeriods : sickPeriods;
    const divId   = type === 'vacation' ? 'vacationDisplay' : 'sickDisplay';
    const div     = document.getElementById(divId);

    div.innerHTML = periods.map((p, i) => {
        const days  = p.end - p.start + 1;
        const label = p.start === p.end
            ? `${mName} ${p.start}`
            : `${mName} ${p.start}–${p.end} (${days}d)`;
        return `<div class="date-badge ${type}">
            <span class="badge-dot"></span>
            <span>${label}</span>
            <span class="badge-remove" onclick="removePeriod('${type}',${i})">${SVG.close}</span>
        </div>`;
    }).join('');
}

function removePeriod(type, index) {
    if (type === 'vacation') {
        vacationPeriods.splice(index, 1);
        renderPeriodBadges('vacation');
        syncPeriodInput('vacation');
    } else {
        sickPeriods.splice(index, 1);
        renderPeriodBadges('sick');
        syncPeriodInput('sick');
    }
    updateStats();
}

function syncPeriodInput(type) {
    const periods = type === 'vacation' ? vacationPeriods : sickPeriods;
    const id      = type === 'vacation' ? 'vacation' : 'sick';
    const value   = periods.map(p => p.start === p.end ? String(p.start) : `${p.start}-${p.end}`).join(',');
    setDateInput(id, value);
}

/* ── Quick vacation: adds a period of N working days ── */
function addQuickVacation(workDays) {
    const { year, month } = getYM();
    const daysInMonth = new Date(year, month, 0).getDate();
    const hols = new Set(
        (getHolidayList(year) || []).filter(h => h.month === month).map(h => h.day)
    );

    // Days already in existing vacation periods
    const taken = new Set();
    vacationPeriods.forEach(p => { for (let d = p.start; d <= p.end; d++) taken.add(d); });

    let start = null, end = null, count = 0;

    for (let d = 1; d <= daysInMonth && count < workDays; d++) {
        const dow = new Date(year, month - 1, d).getDay();
        if (dow === 0 || dow === 6 || hols.has(d) || taken.has(d)) continue;
        if (start === null) start = d;
        end = d;
        count++;
    }

    if (start === null) return;

    vacationPeriods.push({ start, end });
    renderPeriodBadges('vacation');
    syncPeriodInput('vacation');
    setTimeout(updateStats, 80);
}

function clearVacation() {

    updateStats();
}
function clearSick() {

}

/* ── setDateInput: keeps value + data-value in sync ── */
function setDateInput(id, value) {
    const el = document.getElementById(id);
    el.value = value;
    if (value) el.setAttribute('data-value', value);
    else el.removeAttribute('data-value');
}

/* ── fmtDates: for custom (multiple) picker ── */
function fmtDates(dates) {
    if (!dates || !dates.length) return '';
    const { year, month } = getYM();
    const days = dates
        .filter(d => d.getMonth() + 1 === month && d.getFullYear() === year)
        .map(d => d.getDate())
        .sort((a, b) => a - b);
    if (!days.length) return '';
    if (days.length === 1) return String(days[0]);
    let consecutive = true;
    for (let i = 1; i < days.length; i++) {
        if (days[i] !== days[i - 1] + 1) { consecutive = false; break; }
    }
    return consecutive ? `${days[0]}-${days[days.length - 1]}` : days.join(',');
}

/* ── updateDisplay: for custom type badge ── */
function updateDisplay(type, dates) {
    const { year, month } = getYM();
    const mName = new Date(year, month - 1, 1).toLocaleString('en-US', { month: 'short' });
    const ids   = { vacation: 'vacationDisplay', sick: 'sickDisplay', custom: 'customDisplay' };

    const div = document.getElementById(ids[type]);
    if (!dates || !dates.length) { div.innerHTML = ''; return; }

    const days = dates.map(d => d.getDate()).sort((a, b) => a - b);
    let text;
    if (days.length === 1) {
        text = `${mName} ${days[0]}`;
    } else {
        const isRange = days[days.length - 1] - days[0] === days.length - 1;
        text = isRange
            ? `${mName} ${days[0]}–${days[days.length - 1]} (${days.length} days)`
            : `${days.length} days: ${days.join(', ')}`;
    }

    div.innerHTML = `<div class="date-badge ${type}">
        <span class="badge-dot"></span>
        <span>${text}</span>
        <span class="badge-remove" onclick="clearCustom()">${SVG.close}</span>
    </div>`;
}

/* ── parseDaySet ── */
function parseDaySet(str) {
    const set = new Set();
    if (!str) return set;
    for (const part of str.split(',')) {
        const t = part.trim();
        if (t.includes('-')) {
            const [a, b] = t.split('-').map(Number);
            for (let i = a; i <= b; i++) set.add(i);
        } else {
            const n = parseInt(t);
            if (!isNaN(n)) set.add(n);
        }
    }
    return set;
}

/* ── Stats calculation ── */
async function calculateStats() {
    const { year, month } = getYM();
    const total = new Date(year, month, 0).getDate();

    await loadHolidays(year);
    const holDays = new Set(
        (getHolidayList(year) || []).filter(h => h.month === month).map(h => h.day)
    );

    const vacSet    = parseDaySet(document.getElementById('vacation').getAttribute('data-value') || '');
    const sickSet   = parseDaySet(document.getElementById('sick').getAttribute('data-value') || '');
    const customSet = parseDaySet(document.getElementById('custom_days').getAttribute('data-value') || '');
    const overlap   = [...vacSet].filter(d => sickSet.has(d));

    let working = 0, vacDays = 0, sickDays = 0, customDays = 0;

    for (let d = 1; d <= total; d++) {
        const dow     = new Date(year, month - 1, d).getDay();
        const weekend = dow === 0 || dow === 6;
        const holiday = holDays.has(d);
        const vac     = vacSet.has(d);
        const sick    = sickSet.has(d);
        const custom  = customSet.has(d);

        if (vac)    vacDays++;
        if (sick)   sickDays++;
        if (custom) customDays++;
        if (!weekend && !holiday && !vac && !sick && !custom) working++;
    }

    return { total, working, holidays: holDays.size, vacDays, sickDays, customDays, hours: working * 8, overlap };
}

async function updateStats() {
    const s = await calculateStats();

    document.getElementById('statTotalDays').textContent     = s.total;
    document.getElementById('statWorkingDays').textContent   = s.working;
    document.getElementById('statHolidays').textContent      = s.holidays;
    document.getElementById('statExpectedHours').textContent = s.hours + 'h';

    document.getElementById('statVacation').textContent = s.vacDays   ? s.vacDays   + ' d' : '—';
    document.getElementById('statSick').textContent     = s.sickDays  ? s.sickDays  + ' d' : '—';
    document.getElementById('statCustom').textContent   = s.customDays ? s.customDays + ' d' : '—';

    document.getElementById('statsBox').style.display = 'block';

    const hasAbsences = s.vacDays + s.sickDays + s.customDays > 0;
    document.getElementById('absenceChips').style.display = hasAbsences ? 'flex' : 'none';

    const hint  = document.getElementById('validationHint');
    const total = s.vacDays + s.sickDays + s.customDays;

    if (s.overlap && s.overlap.length > 0) {
        hint.className = 'hint warning';
        hint.innerHTML = `<span class="hint-label">Warning:</span> Vacation and sick overlap on day(s): ${s.overlap.join(', ')}. Sick takes priority in export.`;
        hint.style.display = 'block';
    } else if (total > 0) {
        if (s.working < 5) {
            hint.className = 'hint warning';
            hint.innerHTML = `<span class="hint-label">Warning:</span> Only ${s.working} working days this month (${s.hours}h)`;
        } else {
            hint.className = 'hint success';
            hint.innerHTML = `<span class="hint-label">Note:</span> ${total} absence day(s) — ${s.working} working days (${s.hours}h)`;
        }
    } else {
        hint.className = 'hint info';
        hint.innerHTML = `<span class="hint-label">Info:</span> Full month: ${s.working} working days = ${s.hours} hours`;
    }
    hint.style.display = 'block';
    saveFormState();
}

/* ── Preview edit helpers ── */
function isDayLocked(dayNum) {
    const { year, month } = getYM();
    const dow = new Date(year, month - 1, dayNum).getDay();
    if (dow === 0 || dow === 6) return true;
    const hols = getHolidayList(year).filter(h => h.month === month);
    return hols.some(h => h.day === dayNum);
}

function getLockTooltip(dayNum) {
    const { year, month } = getYM();
    const dow = new Date(year, month - 1, dayNum).getDay();
    if (dow === 0 || dow === 6) return 'Weekend — cannot edit';
    return 'Public holiday — cannot edit';
}

function initPreviewDays(days) {
    return days.map(d => ({
        ...d,
        locked: isDayLocked(d.day),
    }));
}

function daysToRanges(days) {
    if (!days.length) return '';
    const sorted = [...days].sort((a, b) => a - b);
    const ranges = [];
    let start = sorted[0], end = sorted[0];
    for (let i = 1; i < sorted.length; i++) {
        if (sorted[i] === end + 1) end = sorted[i];
        else {
            ranges.push(start === end ? String(start) : `${start}-${end}`);
            start = end = sorted[i];
        }
    }
    ranges.push(start === end ? String(start) : `${start}-${end}`);
    return ranges.join(',');
}

function daysToPeriods(days) {
    if (!days.length) return [];
    const sorted = [...days].sort((a, b) => a - b);
    const periods = [];
    let start = sorted[0], end = sorted[0];
    for (let i = 1; i < sorted.length; i++) {
        if (sorted[i] === end + 1) end = sorted[i];
        else {
            periods.push({ start, end });
            start = end = sorted[i];
        }
    }
    periods.push({ start, end });
    return periods;
}

function computePreviewSummary() {
    const hoursPerDay = parseInt(document.getElementById('hours_per_day').value) || 8;
    let working = 0, holidays = 0, vac = 0, sick = 0, custom = 0;
    for (const d of previewDays) {
        if (d.status === 'working')  working++;
        else if (d.status === 'holiday')  holidays++;
        else if (d.status === 'vacation') vac++;
        else if (d.status === 'sick')     sick++;
        else if (d.status === 'custom')   custom++;
    }
    return {
        total_days:   previewDays.length,
        working_days: working,
        total_hours:  working * hoursPerDay,
        vacation_days: vac,
        sick_days:     sick,
        custom_days:   custom,
        holiday_days:  holidays,
    };
}

function cyclePreviewDay(dayNum) {
    const day = previewDays.find(d => d.day === dayNum);
    if (!day || day.locked) return;

    const hoursPerDay = parseInt(document.getElementById('hours_per_day').value) || 8;
    const cur = PREVIEW_EDIT_CYCLE.includes(day.status) ? day.status : 'working';
    const next = PREVIEW_EDIT_CYCLE[(PREVIEW_EDIT_CYCLE.indexOf(cur) + 1) % PREVIEW_EDIT_CYCLE.length];

    day.status = next;
    day.hours  = next === 'working' ? hoursPerDay : 0;
    if (next === 'custom') {
        day.custom_reason = document.getElementById('custom_reason').value.trim() || 'Other';
    } else {
        day.custom_reason = null;
    }
    renderPreviewTable();
}

function renderPreviewTable() {
    if (!previewDays) return;

    const summary = computePreviewSummary();
    const defaultReason = document.getElementById('custom_reason').value.trim() || 'Other';
    let rows = '';

    for (const d of previewDays) {
        const info = PREVIEW_STATUS_MAP[d.status];
        let statusTx = info.label;
        if (d.status === 'holiday') statusTx = d.holiday_name;
        if (d.status === 'custom')  statusTx = d.custom_reason || defaultReason;

        const rowCls  = d.locked ? 'preview-locked' : 'preview-editable';
        const title   = d.locked ? getLockTooltip(d.day) : 'Tap to cycle: Working → Vacation → Sick → Other';
        const icon    = d.locked
            ? '<span class="preview-lock-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>'
            : '<span class="preview-edit-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></span>';
        const click   = d.locked ? '' : ` onclick="cyclePreviewDay(${d.day})"`;
        const hoursStr = d.hours > 0 ? `${d.hours}h` : '—';

        rows += `<tr class="${info.cls} ${rowCls}" data-day="${d.day}" title="${title}"${click}>
            <td>${d.day}</td>
            <td>${d.date_str}</td>
            <td class="preview-status-cell">${statusTx} ${icon}</td>
            <td>${hoursStr}</td>
        </tr>`;
    }

    const s = summary;
    rows += `<tr class="row-summary">
        <td colspan="3">Total: ${s.working_days} working day${s.working_days !== 1 ? 's' : ''}</td>
        <td>${s.total_hours}h</td>
    </tr>`;

    document.getElementById('previewContent').innerHTML = `
        <p class="preview-hint">Click a day&apos;s status to cycle: Working → Vacation → Sick → Other. Weekends and holidays are locked.</p>
        <div class="preview-legend">
            <div class="legend-item"><div class="legend-dot" style="background:#E2E8F0;border:1px solid #CBD5E1"></div> Weekend</div>
            <div class="legend-item"><div class="legend-dot" style="background:var(--danger)"></div> Holiday</div>
            <div class="legend-item"><div class="legend-dot" style="background:var(--vacation)"></div> Vacation</div>
            <div class="legend-item"><div class="legend-dot" style="background:var(--sick)"></div> Sick</div>
            <div class="legend-item"><div class="legend-dot" style="background:var(--custom)"></div> Other</div>
            <div class="legend-item"><div class="legend-dot" style="background:white;border:1px solid var(--border)"></div> Working</div>
        </div>
        <div class="preview-table-wrap">
            <table class="preview-table">
                <thead>
                    <tr>
                        <th style="width:36px">#</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Hours</th>
                    </tr>
                </thead>
                <tbody>${rows}</tbody>
            </table>
        </div>
        <div class="preview-actions">
            <button type="button" class="btn-apply-preview" onclick="applyPreviewToForm()">Apply to form</button>
            <button type="button" class="btn-refresh-preview" onclick="showPreview()">Refresh preview</button>
        </div>
        <p class="preview-hint" id="previewApplyHint" style="display:none;margin-top:10px;margin-bottom:0;"></p>`;
}

function applyPreviewToForm() {
    if (!previewDays) return;

    const vacDays = [], sickDays = [], customDays = [];
    for (const d of previewDays) {
        if (d.status === 'vacation')      vacDays.push(d.day);
        else if (d.status === 'sick')     sickDays.push(d.day);
        else if (d.status === 'custom')   customDays.push(d.day);
    }

    vacationPeriods = daysToPeriods(vacDays);
    sickPeriods     = daysToPeriods(sickDays);

    renderPeriodBadges('vacation');
    renderPeriodBadges('sick');
    syncPeriodInput('vacation');
    syncPeriodInput('sick');

    const customValue = daysToRanges(customDays);
    setDateInput('custom_days', customValue);

    const { year, month } = getYM();
    const customDates = customDays.map(d => new Date(year, month - 1, d));
    if (pickers?.customPicker) {
        pickers.customPicker.setDate(customDates, false);
    }
    updateDisplay('custom', customDates);

    updateStats();

    const hint = document.getElementById('previewApplyHint');
    if (hint) {
        hint.textContent = 'Applied to form — monthly summary updated';
        hint.className = 'preview-hint success';
        hint.style.display = 'block';
    }
}

/* ── Preview ── */
async function showPreview() {
    const form     = document.getElementById('timesheetForm');
    const formData = new FormData(form);

    ['vacation', 'sick', 'custom_days'].forEach(id => {
        const val = document.getElementById(id).getAttribute('data-value') || '';
        formData.set(id, val);
    });

    const previewSection = document.getElementById('previewSection');
    const previewContent = document.getElementById('previewContent');
    const previewBtn     = document.getElementById('previewBtn');
    const monthLabel     = document.getElementById('previewMonthLabel');

    previewBtn.disabled  = true;
    previewBtn.innerHTML = 'Loading…';

    try {
        const { year } = getYM();
        await loadHolidays(year);

        const resp = await fetch('/preview', { method: 'POST', body: formData });
        const data = await resp.json();
        if (data.error) throw new Error(data.error);

        monthLabel.textContent = `— ${data.month} ${data.year}`;
        previewDays = initPreviewDays(data.days);
        renderPreviewTable();

        previewSection.style.display = 'block';
        previewSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

    } catch (err) {
        previewDays = null;
        previewContent.innerHTML = `<div class="result error" style="display:block"><h3>Error</h3><p>${err.message}</p></div>`;
        previewSection.style.display = 'block';
    } finally {
        previewBtn.disabled  = false;
        previewBtn.innerHTML = PREVIEW_BTN_HTML;
    }
}

function closePreview() {
    document.getElementById('previewSection').style.display = 'none';
    document.getElementById('previewContent').innerHTML = '';
    previewDays = null;
}

/* ── Reinitialize on month/year change ── */
async function reinit() {
    if (pickers) {
        pickers.vacationPicker.destroy();
        pickers.sickPicker.destroy();
        pickers.customPicker.destroy();
        pickers = null;
    }

    // Clear all periods and selections
    vacationPeriods = [];
    sickPeriods     = [];
    ['vacation', 'sick', 'custom_days'].forEach(id => setDateInput(id, ''));
    ['vacationDisplay', 'sickDisplay', 'customDisplay'].forEach(id => {
        document.getElementById(id).innerHTML = '';
    });
    closePreview();

    const { year } = getYM();
    await loadHolidays(year);
    pickers = initCalendars();
    updateStats();
}

/* ── Bootstrap ── */
async function init() {
    loadFormState();
    const { year } = getYM();
    await loadHolidays(year);
    pickers = initCalendars();

    const customVal = document.getElementById('custom_days').getAttribute('data-value');
    if (customVal && pickers?.customPicker) {
        const { year: y, month: m } = getYM();
        const dates = [];
        customVal.split(',').forEach(part => {
            const t = part.trim();
            if (!t) return;
            if (t.includes('-')) {
                const [a, b] = t.split('-').map(Number);
                for (let d = a; d <= b; d++) dates.push(new Date(y, m - 1, d));
            } else {
                dates.push(new Date(y, m - 1, parseInt(t, 10)));
            }
        });
        if (dates.length) {
            pickers.customPicker.setDate(dates, false);
            updateDisplay('custom', dates);
        }
    }
    updateStats();
}

init();

document.getElementById('year').addEventListener('change',  reinit);
document.getElementById('month').addEventListener('change', reinit);
['employee_name', 'custom_reason'].forEach(id => {
    document.getElementById(id).addEventListener('input', saveFormState);
});
document.querySelectorAll('input[name="format"]').forEach(el => {
    el.addEventListener('change', saveFormState);
});

/* ── Form submit ── */
document.getElementById('timesheetForm').addEventListener('submit', async e => {
    e.preventDefault();
    const form     = e.target;
    const formData = new FormData(form);

    // Sync data-value for hidden date fields
    ['vacation', 'sick', 'custom_days'].forEach(id => {
        const val = document.getElementById(id).getAttribute('data-value') || '';
        formData.set(id, val);
    });

    const btn     = document.getElementById('generateBtn');
    const loading = document.getElementById('loading');
    const result  = document.getElementById('result');

    btn.disabled          = true;
    loading.style.display = 'block';
    result.style.display  = 'none';

    const fmt = getSelectedFormat();
    document.getElementById('loadingText').textContent =
        fmt === 'xlsx' ? 'Generating Excel…' : 'Generating PDF…';

    try {
        const resp = await fetch('/generate', { method: 'POST', body: formData });
        const ct   = resp.headers.get('content-type') || '';

        if (isDownloadResponse(ct)) {
            const blob = await resp.blob();
            const url  = URL.createObjectURL(blob);
            const a    = Object.assign(document.createElement('a'), { href: url });

            const cd   = resp.headers.get('content-disposition') || '';
            const m    = cd.match(/filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/);
            const defaultName = fmt === 'xlsx' ? 'timesheet.xlsx' : 'timesheet.pdf';
            a.download = m ? m[1].replace(/['"]/g, '') : defaultName;

            document.body.appendChild(a);
            a.click();
            URL.revokeObjectURL(url);
            document.body.removeChild(a);

            result.className = 'result success';
            result.innerHTML = fmt === 'xlsx'
                ? '<h3>Success</h3><p>Excel file downloaded — check your Downloads folder.</p>'
                : '<h3>Success</h3><p>PDF downloaded — check your Downloads folder.</p>';
        } else {
            const data = await resp.json();
            throw new Error(data.error || 'Unknown error');
        }
    } catch (err) {
        result.className = 'result error';
        result.innerHTML = `<h3>Error</h3><p>${err.message}</p>`;
    } finally {
        btn.disabled          = false;
        loading.style.display = 'none';
        result.style.display  = 'block';
    }
});
</script>
</body>
</html>
