<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f8fc">
  <title>Sign in · Urchin People</title>
  <link rel="icon" href="/static/favicon.ico">
  {% include 'brand_head.html' %}
  <link rel="stylesheet" href="/static/account-login.css">
  <script src="/static/account-login.js" defer></script>
</head>
<body class="account-page">
  <div class="login-layout">
    <header class="login-header"><a href="/login" aria-label="Urchin People sign in"><img class="login-brand" src="/static/brand/urchin-systems.png" alt="Urchin Systems" width="1204" height="512"></a>{% include 'theme_toggle.html' %}</header>
    <main class="login-card">
      <span class="login-eyebrow">URCHIN PEOPLE</span>
      <h1>Welcome back</h1>
      <p class="login-intro">Sign in to manage your timesheets, time off and office plans.</p>
      {% if error %}<div class="login-error" role="alert" id="login-error">{{ error }}</div>{% endif %}
      <form action="/login" method="post" data-account-login>
        <input type="hidden" name="_csrf_token" value="{{ login_csrf }}">
        <input type="hidden" name="next" value="{{ next_url }}">
        <label for="account-email">Email</label>
        <input id="account-email" name="email" type="email" autocomplete="username" value="{{ email }}" required maxlength="254" autofocus {% if error %}aria-describedby="login-error"{% endif %}>
        <label for="account-password">Password</label>
        <div class="login-password"><input id="account-password" name="password" type="password" autocomplete="current-password" required maxlength="4096" {% if error %}aria-describedby="login-error"{% endif %}><button type="button" data-password-toggle aria-controls="account-password" aria-label="Show password" aria-pressed="false">Show</button></div>
        <button type="submit" class="login-submit">Sign in <span aria-hidden="true">→</span></button>
      </form>
      <p class="login-support">Need an account or help with your password?<br>Contact your administrator.</p>
    </main>
    <footer class="login-footer">Urchin Systems <span aria-hidden="true">·</span> People</footer>
  </div>
</body>
</html>
